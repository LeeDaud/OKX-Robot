# 套利机器人配置

# 定时定投策略
dca:
  enabled: true
  tokens:
    - address: "0xc2bceb0ee69455da32abb10a5ba81c0299a925c8"
      amount_usdc: 2
      hour: 24              # 24 = 次日 00:00（北京时间）
      minute: 0
      window_minutes: 30

# 深跌加仓策略
deep_buy:
  enabled: false
  threshold_usd: 0.004
  amount_usdc: 10
  cooldown_days: 5

# 网格交易：在价格网格不同价位自动低买高卖，循环套利
grid:
  enabled: true
  token: "0x940181a94a35a4569e4529a3cdfb74e38fd98631"  # AERO
  levels: 4              # 网格位数量
  spread_pct: 3.0        # 相邻位间距（%）
  investment_usdc: 8     # 总投入（均分到每个位）
  profit_pct: 3.0        # 每个位的目标利润率

# AERO 趋势交易策略
aero_trend:
  enabled: false
  pool_address: "0xcddac48af89589052ff14a3cacf58596fe7e2be2"
  poll_interval_sec: 60
  position_size_pct: 0.05
  # 其余使用默认值

# 永续合约交易（SynFutures V3，链上执行，与现货互不影响）
contract:
  enabled: false
  pairs:
    - BTC/USDC
    - ETH/USDC
  default_leverage: 3
  max_leverage_main: 5           # 主流币（BTC/ETH）最大杠杆
  max_leverage_alt: 3            # 山寨币最大杠杆
  max_margin_per_position: 0.3   # 单品种保证金占比上限
  maintenance_margin_multiplier: 2.0  # 维持保证金倍数
  poll_interval_sec: 30

# 双锚稳定套利策略：均值回归，90天价格百分位 + RSI + MACD 入场，ATR 自适应出场
mean_reversion:
  enabled: false
  tokens:
    - symbol: "BTC-USDT"
      token_address: "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"  # cbBTC
    - symbol: "ETH-USDT"
      token_address: "0x4200000000000000000000000000000000000006"  # WETH
  position_size_strong: 0.03       # 强信号 3%
  position_size_medium: 0.015      # 中信号 1.5%
  atr_period: 14
  atr_tp1_mult: 1.5
  atr_tp2_mult: 3.0
  atr_stop_mult: 1.0
  atr_trail_mult: 0.8
  max_positions: 6
  max_daily_open: 2
  time_stop_hours: 120             # 5 天
  force_close_hours: 240           # 10 天
  consecutive_loss_pause: 3
  daily_loss_pct_limit: 0.03
  black_swan_drop_pct: 0.15
  pause_hours: 24
  poll_interval_sec: 300           # 5 分钟

# Unicorn 打新狙击策略
sniper:
  enabled: false
  virtuals_club_url: "https://virtuals.club"
  email: ""                    # virtuals.club 登录邮箱
  password: ""                 # virtuals.club 登录密码
  leaderboard_path: "/api/public/leaderboard"  # 朋友添加的公开接口
  buy_amount_usdc: 20          # 每笔狙击买入金额
  min_window_sec: 60           # 最小 Anti-Sniper 窗口
  max_concentration_pct: 40    # 最大允许大户集中度（超过跳过）
  poll_interval_sec: 30
  max_active_targets: 3
  leaderboard_top_n: 50

# 回购地址簿：回购地址买入指定代币时，立即卖出对应持仓
buyback_watch:
  "0x9Bda49389B29Fa4E204eD9De8f3d7d06f84dA171": "0xc2bceb0ee69455da32abb10a5ba81c0299a925c8"

# 基础代币（VIRTUAL | USDC），决定买入支付代币和卖出收款代币
base_token: VIRTUAL

# 风控
daily_loss_limit_usd: 10     # 每日最大亏损（USDC），超过后停止交易
slippage: 0.01               # 最大滑点 1%
gas_limit_gwei: 50            # gas price 超过此值时跳过（单位 gwei）

# 止盈
take_profit_roi: 0.30         # 止盈收益率阈值（0.30 = 30%），0 = 不启用
take_profit_check_sec: 60     # 止盈轮询间隔（秒）

# 通知
feishu_webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/28a14ab0-82ff-4404-a7ba-f414ada4e659"

# 运行模式
dry_run: true                 # true = 只打印，不发链上交易

# 监控
poll_interval_sec: 10         # 回购事件轮询间隔（秒）
