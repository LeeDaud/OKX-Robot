# 套利机器人配置

# 定时定投策略
dca:
  enabled: true
  tokens:
    - address: "0xc2bceb0ee69455da32abb10a5ba81c0299a925c8"
      amount_usdc: 2
      hour: 24              # 24 = 次日 00:00（北京时间）
      minute: 0
      window_minutes: 30

# 深跌加仓策略
deep_buy:
  enabled: false
  threshold_usd: 0.004
  amount_usdc: 10
  cooldown_days: 5

# 网格交易：在价格网格不同价位自动低买高卖，循环套利
grid:
  enabled: true
  token: "0x940181a94a35a4569e4529a3cdfb74e38fd98631"  # AERO
  levels: 4              # 网格位数量
  spread_pct: 3.0        # 相邻位间距（%）
  investment_usdc: 8     # 总投入（均分到每个位）
  profit_pct: 3.0        # 每个位的目标利润率

# 回购地址簿：回购地址买入指定代币时，立即卖出对应持仓
buyback_watch:
  "0x9Bda49389B29Fa4E204eD9De8f3d7d06f84dA171": "0xc2bceb0ee69455da32abb10a5ba81c0299a925c8"

# 基础代币（VIRTUAL | USDC），决定买入支付代币和卖出收款代币
base_token: VIRTUAL

# 风控
daily_loss_limit_usd: 10     # 每日最大亏损（USDC），超过后停止交易
slippage: 0.01               # 最大滑点 1%
gas_limit_gwei: 50            # gas price 超过此值时跳过（单位 gwei）

# 止盈
take_profit_roi: 0.30         # 止盈收益率阈值（0.30 = 30%），0 = 不启用
take_profit_check_sec: 60     # 止盈轮询间隔（秒）

# 通知
feishu_webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/28a14ab0-82ff-4404-a7ba-f414ada4e659"

# 运行模式
dry_run: true                 # true = 只打印，不发链上交易

# 监控
poll_interval_sec: 10         # 回购事件轮询间隔（秒）
